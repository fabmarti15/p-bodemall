<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<title>P de Bodemall</title>
<style>
  :root{--navy:#17365D;--ink:#1c2430;--gray:#66707d;--line:#e3e8ee;--bluebg:#edf3fc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;min-height:100vh;display:grid;place-items:center;padding:24px}
  .caja{width:100%;max-width:420px;text-align:center}
  h1{font-size:26px;color:var(--navy);margin-bottom:6px}
  p{font-size:14.5px;color:var(--gray);margin-bottom:22px;line-height:1.5}
  form{display:flex;flex-direction:column;gap:10px}
  input{width:100%;padding:14px 16px;font-size:16px;letter-spacing:.12em;text-align:center;border:1px solid var(--line);border-radius:12px;outline:none}
  input:focus{border-color:var(--navy)}
  button{padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .err{color:#b3261e;font-size:13px;min-height:18px;margin-top:8px}
  .menu{display:none;flex-direction:column;gap:14px;text-align:left}
  .doc{border:1px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;background:#fff}
  .doc:hover{border-color:var(--navy);background:var(--bluebg)}
  .doc h2{font-size:17px;color:var(--navy);margin-bottom:4px}
  .doc span{font-size:13px;color:var(--gray)}
  .salir{background:none;border:0;color:var(--gray);font-size:12.5px;cursor:pointer;text-decoration:underline;margin-top:6px}
</style>
</head>
<body>
<div class="caja">
  <h1>P de Bodemall</h1>
  <div id="gate">
    <p>Material privado del directorio. Escribe la clave para entrar.</p>
    <form id="f">
      <input id="k" type="password" autocomplete="current-password" autofocus placeholder="clave">
      <button type="submit">Entrar</button>
    </form>
    <div class="err" id="err"></div>
  </div>
  <div class="menu" id="menu">
    <p style="margin-bottom:6px">¿Qué quieres ver?</p>
    <div class="doc" onclick="abrir('presentacion')"><h2>Presentación del directorio</h2><span>11 láminas · resultados interactivos · jueves 6 de agosto</span></div>
    <div class="doc" onclick="abrir('comparativo')"><h2>Comparativo simple</h2><span>Las 7 alternativas en una página, con línea de tiempo</span></div>
    <button class="salir" onclick="salir()">Cerrar sesión</button>
  </div>
</div>
<script src="datos.js"></script>
<script>
const D=window.BODEMALL_DATOS;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let cache=null;
async function descifrar(clave){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(D.salt),iterations:D.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(D.iv)},key,b64(D.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function abrir(id){
  if(!cache)return;
  document.open();document.write(cache[id]);document.close();
}
function salir(){sessionStorage.removeItem("bodemall_clave");location.href="index.html";}
async function intentar(clave,auto){
  try{
    cache=await descifrar(clave);
    sessionStorage.setItem("bodemall_clave",clave);
    const doc=new URLSearchParams(location.search).get("doc");
    if(doc&&cache[doc]){abrir(doc);return;}
    document.getElementById("gate").style.display="none";
    document.getElementById("menu").style.display="flex";
  }catch(e){
    if(!auto)document.getElementById("err").textContent="Clave incorrecta.";
    sessionStorage.removeItem("bodemall_clave");
  }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();intentar(document.getElementById("k").value,false);});
const guardada=sessionStorage.getItem("bodemall_clave");
if(guardada)intentar(guardada,true);
</script>
</body>
</html>
